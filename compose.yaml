name: product-catalog

services:
  api:
    build:
      context: .
      target: runtime
    image: hemesh283/product-catalog-api:${TAG:-dev}
    restart: unless-stopped
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: hemesh283/product-catalog-web:${TAG:-dev}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3